name: 버그 제보
description: 앱에서 발생한 문제를 제보합니다.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 발생한 문제
      description: 실제로 일어난 일을 설명해 주세요. 수정 시 bug와 작업 영역(ui/ux·data·domain·feat·build·refactor) 라벨을 함께 붙입니다.
      placeholder: 어떤 화면에서 어떤 문제가 발생했나요?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 다시 확인할 수 있는 순서와 조건을 적어 주세요.
      placeholder: |
        1. ... 화면으로 이동
        2. ... 버튼 선택
        3. ... 오류 확인
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 정상적으로는 어떻게 동작해야 하나요?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: 기기, Android 버전, 앱 버전을 알면 적어 주세요.
      placeholder: 예) Pixel 8 / Android 16 / 앱 1.0
  - type: textarea
    id: attachments
    attributes:
      label: 참고 자료
      description: 스크린샷이나 로그가 있으면 첨부해 주세요. 개인정보는 가려 주세요.
