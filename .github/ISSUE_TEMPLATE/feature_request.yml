name: 기능 제안
description: 새로운 기능이나 사용성 개선을 제안합니다.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 어떤 상황에서 무엇이 불편한가요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 원하는 동작이나 화면 흐름을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 구현 완료를 확인할 수 있는 조건을 적어 주세요.
      placeholder: |
        - [ ] 사용자가 ...할 수 있다.
        - [ ] ... 상황에서 ...가 표시된다.
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 디자인, 정책, 관련 이슈가 있으면 연결해 주세요.
