name: 기능 제안
description: 새로운 기능 흐름과 동작을 제안합니다. UI, data, domain 작업은 영역별로 나눕니다.
title: "[Feature] "
labels: ["feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 어떤 상황에서 무엇이 불편한가요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 원하는 동작이나 화면 흐름을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 구현 완료 조건을 적어 주세요. ui/ux, data, domain, feat별 PR로 나누고 각 PR은 800줄 이내로 계획합니다.
      placeholder: |
        - [ ] 사용자가 ...할 수 있다.
        - [ ] ... 상황에서 ...가 표시된다.
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 디자인, 정책, 관련 이슈가 있으면 연결해 주세요.
