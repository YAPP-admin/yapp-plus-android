name: 유지보수 작업
description: 빌드, 의존성, 문서 등 기능 외 작업을 기록합니다.
title: "[Task] "
labels: ["build"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 작업 목표
      description: 변경할 대상과 필요한 이유를 적어 주세요. 구조 개선은 refactor, 개발 작업은 ui/ux·data·domain·feat 중 해당 영역으로 라벨을 바꿉니다.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 완료 조건과 PR 분리 계획을 적어 주세요. 각 PR의 추가·삭제 줄 수 합은 800 이하여야 합니다.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 관련 링크나 제약이 있으면 적어 주세요.
