name: 유지보수 작업
description: 빌드, 의존성, 문서 등 기능 외 작업을 기록합니다.
title: "[Chore] "
labels: ["chore"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 작업 목표
      description: 변경할 대상과 필요한 이유를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 작업이 끝났는지 확인할 수 있는 조건을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 관련 링크나 제약이 있으면 적어 주세요.
